  # Foydalanuvchi profiliga o'rnatiladigan dasturlar uchun QO'SHIMCHA ruxsat
  # etilgan papkalar (normallashtirilgan nom -> prefikslar). %localappdata% va
  # %appdata% istalgan foydalanuvchi profiliga mos keladi. Nom tasks/autoruns
  # ro'yxatida ham bo'lishi shart; bu yerdan tashqaridagi yo'l = masquerade.
  vendor_paths:
    onedrive: &onedrive
    - '%localappdata%\microsoft\onedrive\'
    - c:\program files\microsoft onedrive\
    onedrive reporting task: *onedrive
    onedrive standalone update task: *onedrive
    onedrive startup task: *onedrive
    onedrive per-machine standalone update task: *onedrive
    teams:
    - '%localappdata%\microsoft\windowsapps\msteams_'
    - '%localappdata%\microsoft\teams\'
    com.squirrel.teams.teams:
    - '%localappdata%\microsoft\teams\'
    ciscospark:
    - '%appdata%\microsoft\windows\start menu\programs\webex\'
    - '%localappdata%\ciscospark\'
    - '%localappdata%\webex\'
    - '%localappdata%\programs\cisco spark\'
    ciscomeetingdaemon:
    - '%localappdata%\webex\'
    proton drive:
    - '%localappdata%\programs\proton\drive\'
    zoom: &zoom
    - '%appdata%\zoom\bin\'
    zoomupdatetaskuser: *zoom
    slack: &slack
    - '%localappdata%\slack\'
    com.squirrel.slack.slack: *slack
    telegram desktop:
    - '%appdata%\telegram desktop\'
    dropbox:
    - '%appdata%\dropbox\'
    firefox background update: &mozilla
    - c:\programdata\mozilla-
    firefox default browser agent: *mozilla
    googleupdatetaskuser*:
    - '%localappdata%\google\update\'
    microsoftedgeupdatetaskuser*:
    - '%localappdata%\microsoft\edgeupdate\'
    dropboxupdatetaskuser*:
    - '%localappdata%\dropbox\update\'
