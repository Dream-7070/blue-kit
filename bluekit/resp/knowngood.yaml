  # \appdata\ / \programdata\ ostida bo'lsa ham "shubhali papka" hisoblanmaydigan,
  # faqat admin/TrustedInstaller yoza oladigan Microsoft papkalari.
  standard_locations:
  - c:\programdata\microsoft\windows defender\platform\
  - c:\programdata\microsoft\windows defender advanced threat protection\
  # Vazifa YO'LI (task.path) shu prefikslardan biri bilan boshlansa VA action
  # toza bo'lsa (exe service_paths da, argumentlarda begona yo'l/URL/kodlangan
  # buyruq yo'q) known-good. \Microsoft\Windows\ ostidagi powershell -enc kabi
  # vazifa known-good EMAS.
  task_prefixes:
  - \microsoft\windows\
  - \microsoft\xblgamesave\
  - \microsoft\office\
  - \microsoft\edgeupdate\
  # Ildiz (\) yoki vendor papkasidagi vazifalar: nom normallashtiriladi, '*' = prefiks.
  tasks:
  - googleupdatetaskmachine*
  - googleupdatetaskuser*
  - microsoftedgeupdatetaskmachine*
  - microsoftedgeupdatetaskuser*
  - ccleanerskippuac
  - ccleaner update
  - dropboxupdatetaskmachine*
  - dropboxupdatetaskuser*
